syntax = "proto3";

package user.v1;

import "googleapis/google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/nhassl3/servicehub-contracts/pkg/pb/user/v1;userv1";

service UserService {
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      patch: "/api/v1/users/me"
      body: "*"
    };
  }

  rpc UploadAvatar(UploadAvatarRequest) returns (UploadAvatarResponse) {
    option (google.api.http) = {
      patch: "/api/v1/users/me/uploadavatar"
      body: "*"
    };
  }

  rpc RequestResetEmail(RequestResetEmailRequest) returns (RequestResetEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/me/request-reset-email"
    };
  }

  rpc ResetEmail(ResetEmailRequest) returns (ResetEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/me/reset-email"
      body: "*"
    };
  }

  rpc RequestResetPassword(RequestResetPasswordRequest) returns (RequestResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/me/request-reset-password"
      body: "*"
    };
  }

  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/me/reset-password"
      body: "*"
    };
  }

  rpc RequestVerifyEmail(RequestVerifyEmailRequest) returns (RequestVerifyEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/me/request-verify-email"
      body: "*"
    };
  }

  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/me/verify-email"
      body: "*"
    };
  }
}

message RequestResetEmailRequest {}

message RequestResetEmailResponse {
  string operation_id = 1;
}

message ResetEmailRequest {
  string reset_email_token = 1;
  string new_email = 2 [(validate.rules).string.email = true];
}

message ResetEmailResponse {
  bool success = 1;
}

// TODO: oneof realize better than `optional string` with all fields the request message of contract
message RequestResetPasswordRequest {
  optional string username  = 1 [
    (validate.rules).string = {
      pattern: "^[a-zA-Z0-9]+([-_][a-zA-Z0-9]+)*$",
      max_bytes: 256,
    }
  ];
  optional string email = 2 [(validate.rules).string.email = true];
}

message RequestResetPasswordResponse {
  string operation_id = 1;
}

message ResetPasswordRequest {
  string reset_token = 1;
  string password = 2 [(validate.rules).string = {
    pattern: "^[a-zA-Z0-9!@#$%^&*()\\-_=+\\[\\]{};:'\",.<>?\\\\|`~]{8,}$",
    min_len: 8,
  }];
}

message ResetPasswordResponse { bool success = 1; }

message RequestVerifyEmailRequest {
  string email = 1 [(validate.rules).string.email = true];
}

message RequestVerifyEmailResponse {
  string operation_id = 1;
}

message VerifyEmailRequest {
  string verify_token = 1;
}

message VerifyEmailResponse {
  string access_token = 2;
  string refresh_token = 3;
  bool success = 1;
}

message UpdateProfileRequest {
  string full_name  = 1;
  string avatar_url = 2;
}

message UpdateProfileResponse {
  UserProfile user = 1;
}

message UploadAvatarRequest {
  bytes file_data = 1;
}

message UploadAvatarResponse {
  UserProfile user = 1;
}

message UserProfile {
  string                    username   = 1;
  string                    uid        = 2;
  string                    email      = 3;
  string                    full_name  = 4;
  string                    avatar_url = 5;
  string                    role       = 6;
  bool                      is_active  = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
